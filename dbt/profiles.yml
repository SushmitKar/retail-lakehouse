retail_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: lakehouse.duckdb
      extensions:
        - delta
        - azure
      secrets:
        - type: azure
          provider: config
          connection_string: "AccountName={{ env_var('AZURE_STORAGE_ACCOUNT') }};AccountKey={{ env_var('AZURE_STORAGE_KEY') }};EndpointSuffix=core.windows.net"